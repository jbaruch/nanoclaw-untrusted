name: Review & Publish Plugin

permissions:
  id-token: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable SHAs per `jbaruch/coding-policy:
      # dependency-management`. Renewal: Dependabot (github-actions
      # ecosystem, weekly) proposes bump PRs — see .github/dependabot.yml.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Required by jbaruch/coding-policy/.github/actions/skill-review:
          # the action runs `git diff $BEFORE..HEAD` to find changed skills.
          fetch-depth: 0

      - uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      # Reviews only the skills whose files changed in this push, instead
      # of every skill in the plugin every time. Action lives in
      # jbaruch/coding-policy so improvements land once and propagate
      # to every consumer plugin. Pinned to an immutable SHA per
      # `jbaruch/coding-policy: dependency-management`.
      - name: Skill review (changed only)
        uses: jbaruch/coding-policy/.github/actions/skill-review@b63f13ea80e92c784cf71fc74ed98f71b15f2aa2 # v0.x
        with:
          threshold: '85'

      - name: Lint plugin
        run: tessl plugin lint .

      - uses: tesslio/patch-version-publish@d1363877846ebf6bc09e032e2dc8612f1d7e38dd # v1
        with:
          token: ${{ secrets.TESSL_TOKEN }}
